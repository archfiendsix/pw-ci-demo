  <h1>Playwright CI Demo</h1>
  <p>A tiny website used to exercise GitHub CI/CD triggers with colocated Playwright tests.</p>

  <section>
    <h2>Quote of the moment</h2>
    <p data-testid="quote">Loading…</p>
  </section>

  <script>
    // Fetched from the fake API — api-mock.spec.ts intercepts this.
    fetch('/api/quote')
      .then((r) => r.json())
      .then((d) => { document.querySelector('[data-testid="quote"]').textContent = d.quote; })
      .catch(() => { document.querySelector('[data-testid="quote"]').textContent = 'Failed to load'; });
  </script>
</body>
