name: e2e

# --- Step 3: triggers ---
on:
  pull_request:                 # gate PRs into main with a fast subset
    branches: [main]
  push:
    branches: [main]            # full run after merge
  schedule:
    - cron: '0 3 * * *'         # nightly full suite (03:00 UTC)
  workflow_dispatch:            # manual "Run workflow" button

# Cancel an in-flight run when new commits land on the same branch/PR.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm           # cache ~/.npm between runs

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # PR  -> @smoke subset (fast gate).  Everything else -> full suite.
      - name: Run Playwright tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright test --grep @smoke
          else
            npx playwright test
          fi

      # --- Step 4: artifacts (upload even when tests fail) ---
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
